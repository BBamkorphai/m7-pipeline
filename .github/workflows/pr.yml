# The pull-request gate the challenge assembles. Three jobs, four checks:
# ruff, the whole test suite, and bundle validate for each target. All are
# made required in the branch ruleset, so a pull request that fails any one
# of them cannot merge.
name: PR gate

on:
  pull_request:
    paths-ignore: ["**/*.md"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ruff over the library, the notebooks and the tests
        run: |
          pip install ruff
          ruff check src tests

  tests:
    runs-on: ubuntu-latest
    env:
      M7_REQUIRE_SPARK: "1"      # never silently skip the Spark levels in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the test dependencies
        run: pip install -r requirements-dev.txt
      - name: Every level that runs without a workspace
        run: pytest -q

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [dev, prod]
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.13.0
      - name: Validate ${{ matrix.target }}
        run: databricks bundle validate -t ${{ matrix.target }}
